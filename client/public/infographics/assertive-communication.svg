<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F7FF" />
      <stop offset="100%" stop-color="#DCEBFA" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5FA8" />
      <stop offset="100%" stop-color="#144275" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E5FA8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="28" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="776" height="476" rx="22" fill="none" stroke="#B8D7F5" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Header Banner -->
  <rect x="40" y="32" width="720" height="76" rx="18" fill="url(#cardGrad)" filter="url(#shadow)" />
  <text x="70" y="66" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">PANDUAN VISUAL SOCICARE AI</text>
  <text x="70" y="92" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Formula Komunikasi Asertif: "I-Statement"</text>
  <rect x="620" y="48" width="120" height="42" rx="12" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" />
  <text x="680" y="74" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎯 3 Langkah</text>

  <!-- Step 1 Card -->
  <g transform="translate(40, 130)" filter="url(#shadow)">
    <rect width="226" height="310" rx="20" fill="#FFFFFF" stroke="#C7E0F8" stroke-width="2" />
    <circle cx="113" cy="56" r="32" fill="#EBF4FD" />
    <text x="113" y="64" font-size="26" text-anchor="middle">🔍</text>
    <rect x="25" y="105" width="40" height="22" rx="6" fill="#1E5FA8" />
    <text x="45" y="120" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">01</text>
    <text x="25" y="152" fill="#163A5F" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Sebut Fakta</text>
    <text x="25" y="174" fill="#4B6A8E" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Bukan Menuduh</text>
    <line x1="25" y1="192" x2="201" y2="192" stroke="#E2EDF8" stroke-width="2" />
    <text x="25" y="218" fill="#335377" font-family="system-ui, sans-serif" font-size="12" line-height="1.5">
      <tspan x="25" dy="0">Sampaikan kejadian yang</tspan>
      <tspan x="25" dy="18">nyata tanpa memberi cap</tspan>
      <tspan x="25" dy="18">atau menyindir teman.</tspan>
    </text>
    <rect x="25" y="260" width="176" height="36" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <text x="35" y="282" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="700">"Saat tugas belum dikirim..."</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(287, 130)" filter="url(#shadow)">
    <rect width="226" height="310" rx="20" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5" />
    <circle cx="113" cy="56" r="32" fill="#EFF6FF" />
    <text x="113" y="64" font-size="26" text-anchor="middle">💙</text>
    <rect x="25" y="105" width="40" height="22" rx="6" fill="#2563EB" />
    <text x="45" y="120" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">02</text>
    <text x="25" y="152" fill="#163A5F" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Ungkapkan Rasa</text>
    <text x="25" y="174" fill="#2563EB" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Gunakan "Aku merasa"</text>
    <line x1="25" y1="192" x2="201" y2="192" stroke="#E2EDF8" stroke-width="2" />
    <text x="25" y="218" fill="#335377" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="25" dy="0">Fokus pada emosimu</tspan>
      <tspan x="25" dy="18">sendiri, jangan memakai</tspan>
      <tspan x="25" dy="18">kata "Kamu selalu...".</tspan>
    </text>
    <rect x="25" y="260" width="176" height="36" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
    <text x="35" y="282" fill="#1E40AF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">"Aku merasa cemas..."</text>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(534, 130)" filter="url(#shadow)">
    <rect width="226" height="310" rx="20" fill="#FFFFFF" stroke="#C7E0F8" stroke-width="2" />
    <circle cx="113" cy="56" r="32" fill="#EBF4FD" />
    <text x="113" y="64" font-size="26" text-anchor="middle">🤝</text>
    <rect x="25" y="105" width="40" height="22" rx="6" fill="#1E5FA8" />
    <text x="45" y="120" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">03</text>
    <text x="25" y="152" fill="#163A5F" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Ajukan Solusi</text>
    <text x="25" y="174" fill="#4B6A8E" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Secara Kolaboratif</text>
    <line x1="25" y1="192" x2="201" y2="192" stroke="#E2EDF8" stroke-width="2" />
    <text x="25" y="218" fill="#335377" font-family="system-ui, sans-serif" font-size="12">
      <tspan x="25" dy="0">Sampaikan harapan yang</tspan>
      <tspan x="25" dy="18">jelas dan tawarkan kerja</tspan>
      <tspan x="25" dy="18">sama dengan ramah.</tspan>
    </text>
    <rect x="25" y="260" width="176" height="36" rx="8" fill="#FDF2F8" stroke="#F472B6" stroke-width="1" />
    <text x="35" y="282" fill="#9D174D" font-family="system-ui, sans-serif" font-size="11" font-weight="700">"Bisa kita bagi tugasnya?"</text>
  </g>

  <!-- Bottom Helper Note -->
  <text x="400" y="472" fill="#5B7696" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💡 Komunikasi asertif menjaga hubungan tetap rukun tanpa harus memendam perasaan sendiri.</text>
</svg>
